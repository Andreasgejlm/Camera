name: MijickCameraExample
options:
  bundleIdPrefix: com.mijick
  deploymentTarget:
    iOS: "18.0"
packages:
  MijickCamera:
    path: ..
targets:
  MijickCameraExample:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: MijickCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mijick.camera.example
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Camera Example
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: The example app shows the camera.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: The example app records sound with videos.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic
